[project]
name = "mcap2lerobot"
version = "0.1.0"
description = "Convert ROS2 MCAP episode files to LeRobot v3 datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lerobot==0.4.1",
  "mcap>=1.3.0",
  "mcap-ros2-support>=0.5.5",
  "av==15.1.0",
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/XenseRobotics-AI/lerobot2mcap/tree/feature/mcap2lerobot"
Repository = "https://github.com/XenseRobotics-AI/lerobot2mcap"
Issues = "https://github.com/XenseRobotics-AI/lerobot2mcap/issues"

[project.scripts]
mcap2lerobot = "mcap2lerobot.cli:main"

[tool.setuptools]
packages = ["mcap2lerobot"]

[tool.uv]
package = true
